<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.1" />
    </linearGradient>
    
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="500" y="40" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
    COVID-19 Dashboard Architecture
  </text>
  
  <!-- Frontend Layer -->
  <g>
    <!-- Section label -->
    <text x="50" y="100" font-size="16" font-weight="bold" fill="#06b6d4" font-family="Arial, sans-serif">
      Frontend Layer
    </text>
    
    <!-- React App Box -->
    <rect x="50" y="120" width="200" height="80" rx="8" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
    <text x="150" y="155" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      React App
    </text>
    <text x="150" y="175" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      TypeScript + Vite
    </text>
    <text x="150" y="192" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">
      Interactive Maps
    </text>
  </g>
  
  <!-- Visualization Libraries -->
  <g>
    <rect x="280" y="120" width="180" height="80" rx="8" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
    <text x="370" y="155" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Visualization
    </text>
    <text x="370" y="175" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      Recharts • D3 • Maps
    </text>
    <text x="370" y="192" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">
      Charts & Analytics
    </text>
  </g>
  
  <!-- API Communication -->
  <g>
    <line x1="250" y1="160" x2="280" y2="160" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="460" y1="160" x2="490" y2="160" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- API Gateway Box -->
  <g>
    <text x="500" y="100" font-size="16" font-weight="bold" fill="#10b981" font-family="Arial, sans-serif">
      API Layer
    </text>
    
    <rect x="490" y="120" width="180" height="80" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="580" y="155" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      API Gateway
    </text>
    <text x="580" y="175" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      OData Protocol
    </text>
    <text x="580" y="192" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">
      Swagger/OpenAPI
    </text>
  </g>
  
  <!-- Backend Services -->
  <g>
    <text x="770" y="100" font-size="16" font-weight="bold" fill="#f59e0b" font-family="Arial, sans-serif">
      Backend Layer
    </text>
    
    <!-- ASP.NET Core -->
    <rect x="700" y="120" width="160" height="80" rx="8" fill="#512bd4" opacity="0.15" stroke="#512bd4" stroke-width="2" filter="url(#shadow)"/>
    <text x="780" y="155" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      ASP.NET Core
    </text>
    <text x="780" y="175" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      .NET 8.0
    </text>
    <text x="780" y="192" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">
      REST API
    </text>
  </g>
  
  <!-- Connections -->
  <g>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#06b6d4" />
      </marker>
    </defs>
    
    <line x1="670" y1="160" x2="700" y2="160" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Data Access Layer -->
  <g>
    <text x="50" y="280" font-size="16" font-weight="bold" fill="#f59e0b" font-family="Arial, sans-serif">
      Data Access Layer
    </text>
    
    <!-- Entity Framework -->
    <rect x="50" y="300" width="180" height="80" rx="8" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="335" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Entity Framework
    </text>
    <text x="140" y="355" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      ORM Layer
    </text>
    <text x="140" y="372" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">
      Core 8.0
    </text>
  </g>
  
  <!-- Services -->
  <g>
    <rect x="280" y="300" width="180" height="80" rx="8" fill="#06b6d4" opacity="0.15" stroke="#06b6d4" stroke-width="2" filter="url(#shadow)"/>
    <text x="370" y="335" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      Services Layer
    </text>
    <text x="370" y="355" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      Business Logic
    </text>
    <text x="370" y="372" font-size="11" fill="#94a3b8" text-anchor="middle" font-family="Arial, sans-serif">
      Controllers
    </text>
  </g>
  
  <!-- Data Connections -->
  <g>
    <line x1="230" y1="340" x2="280" y2="340" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="460" y1="340" x2="490" y2="240" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="780" y1="200" x2="780" y2="300" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Database -->
  <g>
    <text x="500" y="480" font-size="16" font-weight="bold" fill="#ec4899" font-family="Arial, sans-serif">
      Database Layer
    </text>
    
    <rect x="450" y="500" width="200" height="80" rx="8" fill="#ec4899" opacity="0.15" stroke="#ec4899" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Database cylinder effect -->
    <ellipse cx="550" cy="510" rx="95" ry="15" fill="#ec4899" opacity="0.2" stroke="#ec4899" stroke-width="1"/>
    <rect x="455" y="510" width="190" height="45" fill="#ec4899" opacity="0.15" stroke="#ec4899" stroke-width="1"/>
    <ellipse cx="550" cy="555" rx="95" ry="15" fill="#ec4899" opacity="0.25" stroke="#ec4899" stroke-width="1"/>
    
    <text x="550" y="540" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">
      PostgreSQL
    </text>
    <text x="550" y="560" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      COVID-19 Database
    </text>
  </g>
  
  <!-- Data flow from services to database -->
  <g>
    <line x1="370" y1="380" x2="500" y2="500" stroke="#06b6d4" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Data Models boxes -->
  <g>
    <text x="50" y="480" font-size="14" font-weight="bold" fill="#10b981" font-family="Arial, sans-serif">
      Data Models:
    </text>
    
    <text x="50" y="520" font-size="12" fill="#cbd5e1" font-family="Arial, sans-serif">
      • CovidConfirmedCase
    </text>
    <text x="50" y="545" font-size="12" fill="#cbd5e1" font-family="Arial, sans-serif">
      • CovidDeathCase
    </text>
    
    <text x="280" y="520" font-size="12" fill="#cbd5e1" font-family="Arial, sans-serif">
      • CovidRecoverCase
    </text>
    <text x="280" y="545" font-size="12" fill="#cbd5e1" font-family="Arial, sans-serif">
      • CovidDailyReport
    </text>
  </g>
  
  <!-- External Systems -->
  <g>
    <text x="750" y="480" font-size="14" font-weight="bold" fill="#06b6d4" font-family="Arial, sans-serif">
      External Integration:
    </text>
    
    <rect x="700" y="500" width="120" height="60" rx="4" fill="#06b6d4" opacity="0.1" stroke="#06b6d4" stroke-width="1"/>
    <text x="760" y="525" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      CSV Import
    </text>
    <text x="760" y="545" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="Arial, sans-serif">
      (CsvHelper)
    </text>
  </g>
</svg>